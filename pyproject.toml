[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "solana-meme-bot"
version = "0.1.0"
description = "Automated Solana meme coin trading bot with security screening and risk management"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "httpx>=0.27",
    "websockets>=12.0",
    "solders>=0.21",
    "solana>=0.34",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.5",
    "aiosqlite>=0.20",
    "base58>=2.1",
    "aiofiles>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.3",
]
ml = [
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "numpy>=1.26",
]
telegram = [
    "python-telegram-bot>=21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-p no:cacheprovider --basetemp=.pytest_tmp"

[tool.ruff]
line-length = 100
target-version = "py311"
